doc_type: receipt
fields:
  merchant:
    pattern: (?:merchant|store|shop|händler)\s*[:]?\s*([A-Za-z][A-Za-z0-9&'\-. ]*[A-Za-z0-9])(?=\s*[,;\n]|\s*\.\s|\s*$)
    required: false
  total_amount:
    pattern: (?:total|total paid)\s*[:$]?\s*(?:CHF|EUR|USD|\$)?\s*([0-9][0-9'.,\s]*[0-9]|[0-9])
    required: true
  date:
    pattern: (?:date|datum)\s*[:]?\s*([0-9]{1,4}[-/.][0-9]{1,2}[-/.][0-9]{2,4})
    required: true
