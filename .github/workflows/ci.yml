name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Unit tests
        run: python -m pytest -m unit -v

      - name: Integration tests
        run: python -m pytest -m integration -v

      - name: Full suite with coverage
        run: python -m pytest --cov=doc_intelligence --cov-report=term-missing

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: doc-intelligence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the running container
        run: |
          docker run -d --name doci -p 8000:8000 doc-intelligence:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "health OK"; break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            http://localhost:8000/extract \
            -H "Content-Type: application/json" \
            -d '{"document_id": "inv1", "text": "INVOICE number INV-42. Total: 1250.00"}')
          echo "POST /extract -> $code"
          cat /tmp/out.json
          test "$code" = "200"
          docker rm -f doci
