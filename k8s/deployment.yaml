apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-intelligence
  labels:
    app: doc-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doc-intelligence
  template:
    metadata:
      labels:
        app: doc-intelligence
    spec:
      containers:
        - name: doc-intelligence
          image: doc-intelligence:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          env:
            - name: CHAMPION_BACKEND
              value: "rule"
            # the challenger needs a key; without the secret the alias reports
            # unavailable rather than failing at request time
            - name: CHALLENGER_BACKEND
              value: "llm"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: doc-intelligence-secrets
                  key: openai-api-key
                  optional: true
            - name: OCR_BACKEND
              value: "local"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
