[project]
name = "doc-intelligence"
version = "0.1.0"
description = "Intelligent Document Processing: unstructured documents to structured data, with production MLOps."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "scikit-learn>=1.4",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.5",
    "httpx>=0.27",
]

# Deep-learning stack: LayoutLMv3 fine-tuning and the transformer QA backend. Kept
# optional so CI stays light -- the rule backend and the whole test suite run without it.
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "seqeval>=1.2",
]

# Experiment tracking for the training and benchmark scripts.
tracking = [
    "mlflow>=2.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["unit", "integration"]

[tool.ruff]
line-length = 100
